name: backend-ci

# Deployment gate: Render services must deploy only after this workflow
# passes (enable "Required status check: backend-ci" on main / dev branches,
# and switch Render auto-deploy to "deploy on successful CI" if available).
on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Syntax + inventory + contract smoke + contract audit in one gate.
      - name: Backend test suite
        run: npm test

      - name: Secret scan
        run: npm run security:scan

      # Live contract E2E suites (impersonation + auth lifecycle).
      # Run against the DEV environment with provisioned secrets:
      #   SUPA_DEV_DB_URL, SUPABASE_URL, SUPABASE_SERVICE_KEY,
      #   SUPABASE_JWT_SECRET (dev project only — never production).
      - name: Impersonation contract E2E (dev)
        if: env.SUPA_DEV_DB_URL != ''
        run: node scripts/test-impersonation-contract.js
        env:
          SUPA_DEV_DB_URL: ${{ secrets.E2E_DEV_DB_URL }}
          SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.E2E_SUPABASE_JWT_SECRET }}
          BASE: https://egparts-backend-dev.onrender.com
